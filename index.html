<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>오늘의 시간표 탑</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F1E8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style id="app-style">
:root{--bg:#F5F1E8;--ink:#2B2D33;--muted:#7A7466;--line:#E4DED0;--green:#2E9E6A;--blue:#3B7DD8;--purple:#8A5CC9;--orange:#F07F35}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;overflow:hidden}
input{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;padding:0}
.jua,h1,h2,h3{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:normal}
#app{height:100%}

/* ---------- 학생 화면 ---------- */
.student{height:100%;display:flex;flex-direction:column;padding:16px 20px 20px;gap:14px}
.topbar{display:flex;align-items:center;gap:14px}
.title{font-family:'Jua',sans-serif;font-size:32px}
.date{font-size:18px;color:var(--muted);background:#fff;padding:6px 16px;border-radius:999px;border:2px solid var(--line)}
.spacer{flex:1}
.teacher-btn{color:var(--muted);font-size:15px;padding:8px 14px;border-radius:12px;border:2px dashed var(--line)}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(270px,36%) 1fr;gap:22px}
.palette{background:#fff;border-radius:26px;border:2px solid var(--line);padding:16px 16px 4px;overflow-y:auto;position:relative}
.palette .hint,.palette .lock-note{font-family:'Jua',sans-serif;font-size:18px;color:var(--muted);padding:4px 6px 10px}
.palette .lock-note{color:var(--green)}
.palette.locked .plist{opacity:.35;pointer-events:none;filter:grayscale(.3)}
.palette h2{font-size:21px;margin:6px 4px 10px;display:flex;align-items:center;gap:8px}
.palette h2 .dot{width:14px;height:14px;border-radius:50%}
.plist{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.plist .empty{color:#B3A88F;padding:10px 6px;font-size:16px}
.pblk{height:80px;width:100%;display:block;touch-action:pan-y;border-radius:16px;transition:transform .15s,opacity .15s}
.pblk:active{transform:scale(.97)}
.pblk.dragging-src{opacity:.35}
.ghost{position:fixed;left:0;top:0;z-index:200;pointer-events:none;opacity:.92;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}

/* 블록 */
.blk{display:flex;height:100%;width:100%;background:var(--c);color:var(--fg);border-radius:16px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.13),inset 0 0 0 2px rgba(0,0,0,.06);text-align:left}
.blk-img{height:100%;aspect-ratio:1/1;flex:none;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;overflow:hidden;container-type:size}
.blk-img img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.blk-img .emo{font-size:36px;font-size:58cqh;line-height:1}
.blk-img .letter{font-family:'Jua',sans-serif;color:#2B2D33;opacity:.75}
.blk-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:4px 14px;gap:4px}
.blk-name{font-family:'Jua',sans-serif;font-size:22px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all}
.blk-meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:rgba(255,255,255,.7);color:#2B2D33;font-size:13px;padding:1px 9px;border-radius:99px}

/* 탑 */
.tower-area{display:flex;flex-direction:column;min-height:0;gap:16px}
.tower-shell{flex:1;min-height:0;position:relative}
.tower-wrap{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;border-radius:26px;transition:background .2s;-webkit-overflow-scrolling:touch}
.tower-wrap::-webkit-scrollbar{display:none}
.world{position:relative;display:grid;grid-template-columns:150px minmax(0,470px);justify-content:center;column-gap:16px;padding-bottom:16px;min-height:100%}
.world::after{content:'';position:absolute;bottom:2px;left:8%;right:8%;height:10px;background:#D8CFBC;border-radius:6px}
.more{position:absolute;left:4px;z-index:5;background:rgba(43,45,51,.85);color:#fff;font-family:'Jua',sans-serif;font-size:17px;padding:7px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.more.show{opacity:1;pointer-events:auto}
.more.up{top:8px}.more.down{bottom:26px}
.fnum{position:absolute;left:-34px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #D8CFBC;color:#9A8F78;font-family:'Jua',sans-serif;font-size:14px;display:flex;align-items:center;justify-content:center}
.tower-wrap.dragover{background:rgba(255,190,120,.15)}
.signs,.tower{position:relative;height:100%}
.pole{position:absolute;left:24px;bottom:-14px;width:10px;background:#B9A88A;border-radius:5px;transition:height .6s ease}
.sign.sign-in{animation:signIn .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes signIn{from{transform:translateX(-46px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.sign.sign-out{animation:signOut .55s ease-in forwards;pointer-events:none;z-index:0}
@keyframes signOut{to{transform:translateX(-56px) scale(.7);opacity:0}}
.sign.last{z-index:2}
.sign.last span{box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 0 0 3px #fff}
.sign{position:absolute;left:0;right:0;display:flex;align-items:center}
.sign span{position:relative;display:flex;align-items:center;padding-left:16px;height:62%;min-height:40px;max-height:64px;width:100%;background:var(--sc);color:var(--sf,#fff);font-family:'Jua',sans-serif;font-size:26px;clip-path:polygon(0 0,78% 0,100% 50%,78% 100%,0 100%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.floor{position:absolute;left:0;right:0}
.floor .blk{box-shadow:0 6px 0 rgba(0,0,0,.16),inset 0 0 0 2px rgba(0,0,0,.06)}
.floor .blk-name{font-size:clamp(20px,2.6vh + 8px,34px)}
.floor .tag{font-size:15px}
.floor.now .blk{box-shadow:0 6px 0 rgba(0,0,0,.16),0 0 0 5px #fff,0 0 0 9px var(--green)}
.floor.now::before{content:'지금';position:absolute;top:-14px;left:-10px;z-index:2;background:var(--green);color:#fff;font-family:'Jua',sans-serif;font-size:17px;padding:2px 12px;border-radius:99px}
.slot{position:absolute;left:0;right:0;border:3px dashed #D5CCBA;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#B3A88F;font-family:'Jua',sans-serif;font-size:22px}
.slot.next{border-color:#E9A869;color:#D08440;background:rgba(255,200,140,.12)}
.tower-wrap.dragover .slot.next{background:rgba(255,200,140,.4)}
.rm{position:absolute;top:-10px;right:-10px;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:18px;color:#B04A2E;z-index:2}
.floor.drop{animation:drop .5s cubic-bezier(.3,1.45,.5,1)}
@keyframes drop{from{transform:translateY(-90px);opacity:0}to{transform:none;opacity:1}}
.floor.leaving{animation:leave .75s ease-in forwards;z-index:3}
.floor.leaving::after{content:'✓';position:absolute;right:16px;top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif}
@keyframes leave{0%{transform:none}30%{transform:scale(1.05)}100%{transform:translateX(75%) scale(.8);opacity:0}}
.celebrate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:'Jua',sans-serif;font-size:34px;line-height:1.35;color:var(--green)}
.celebrate .cele-emo{font-size:90px}

.controls{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding-left:166px}
.big{font-family:'Jua',sans-serif;font-size:28px;padding:0 30px;height:80px;border-radius:24px;display:inline-flex;align-items:center;gap:10px;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .1s,box-shadow .1s}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.big:disabled{opacity:.35;pointer-events:none}
.b-start{background:var(--blue);color:#fff}
.b-done{background:var(--green);color:#fff}
.b-complete{background:var(--orange);color:#fff}
.b-soft{background:#fff;color:var(--muted);box-shadow:0 5px 0 var(--line);border:2px solid var(--line);font-size:22px}

/* ---------- 활동(수업/쉬는 시간) 화면 ---------- */
.activity{position:fixed;inset:0;z-index:50;background:#FBF9F4;border:22px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.act-close{position:absolute;top:16px;left:16px;font-size:16px;color:var(--muted);background:#fff;border:2px solid var(--line);padding:8px 14px;border-radius:12px}
.act-kind{font-family:'Jua',sans-serif;font-size:60px;line-height:1.1;text-align:center}
.untimed .act-kind{font-size:clamp(70px,13vw,140px)}
.act-blk{display:flex;align-items:center;gap:14px;background:var(--c);color:var(--fg);padding:10px 24px 10px 10px;border-radius:22px;font-family:'Jua',sans-serif;font-size:32px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.act-blk .im{width:76px;height:76px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:48px;flex:none}
.act-blk .im img{width:100%;height:100%;object-fit:cover}
.act-timer{display:flex;gap:48px;align-items:center;justify-content:center;flex-wrap:wrap}
.an-box{display:flex;flex-direction:column;align-items:center;gap:12px}
.analog{width:min(50vh,430px);height:min(50vh,430px)}
.act-timer.both .analog{width:min(44vh,360px);height:min(44vh,360px)}
.legend{display:flex;gap:22px;font-size:21px;align-items:center}
.legend span{display:flex;align-items:center;gap:8px}
.legend b{font-family:'Jua',sans-serif;font-weight:normal;font-size:24px}
.sw{width:26px;height:26px;border-radius:7px;display:inline-block;border:2px solid rgba(0,0,0,.15)}
.sw.hatch{background:repeating-linear-gradient(45deg,#ECE8DF 0 5px,#D6D0C2 5px 9px)}
.digital{display:flex;flex-direction:column;align-items:center;gap:10px}
.dg-label{font-family:'Jua',sans-serif;font-size:26px;color:var(--muted)}
.dg-time{font-family:'Jua',sans-serif;font-size:clamp(84px,13vw,150px);background:#2B2D33;color:#fff;padding:4px 28px;border-radius:26px;display:flex;line-height:1.15}
.dg-time i{font-style:normal;display:inline-block;width:.6em;text-align:center}
.dg-time i.colon{width:.32em}
.act-msg{font-family:'Jua',sans-serif;font-size:40px;color:#C9502A;text-align:center}
.act-msg:empty{display:none}
.act-actions{display:flex;gap:16px}
.act-actions:empty{display:none}
.activity{justify-content:safe center;overflow-y:auto}
.activity.ended .analog,.activity.ended .digital{opacity:.55}
.activity.ended .analog{width:min(32vh,280px);height:min(32vh,280px)}
.activity.ended .legend{display:none}
.activity.ended .dg-time{font-size:clamp(60px,9vw,100px)}

/* ---------- 모달 ---------- */
.modal-bg{position:fixed;inset:0;z-index:120;background:rgba(43,45,51,.45);display:flex;align-items:center;justify-content:center;animation:fadein .2s}
.modal{background:#fff;border-radius:28px;padding:26px 28px;width:min(92vw,380px);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{margin:0 0 6px;font-size:28px}
.modal p{margin:0 0 16px;color:var(--muted);font-size:17px}
.dots{display:flex;gap:16px;justify-content:center;margin-bottom:20px}
.dots i{width:22px;height:22px;border-radius:50%;border:3px solid #CFC6B3}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keypad button{height:66px;border-radius:18px;background:#F3EFE6;font-family:'Jua',sans-serif;font-size:30px}
.keypad button.sm{font-size:18px;color:var(--muted)}
.keypad button:active{background:#E5DFD2}
.modal .row{display:flex;gap:12px;justify-content:center;margin-top:8px}
.btn{font-family:'Jua',sans-serif;font-size:19px;padding:12px 20px;border-radius:14px;background:#F3EFE6;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--blue);color:#fff}
.btn.danger{background:#D9534F;color:#fff}
.btn.ghost-btn{background:transparent;border:2px solid var(--line);color:var(--muted)}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);opacity:0;z-index:300;background:#2B2D33;color:#fff;font-family:'Jua',sans-serif;font-size:20px;padding:12px 24px;border-radius:999px;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 선생님 화면 ---------- */
.teacher{height:100%;display:flex;flex-direction:column;background:#EEF1F5}
.t-head{display:flex;align-items:center;gap:14px;padding:14px 20px;background:#fff;border-bottom:2px solid #DDE3EA}
.t-head h1{margin:0;font-size:26px}
.save-status{font-size:15px;color:var(--muted)}
.t-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,34%) 1fr}
.t-list{overflow-y:auto;padding:16px;border-right:2px solid #DDE3EA}
.t-list h3{font-size:19px;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}
.t-list h3 small{font-family:'Gowun Dodum',sans-serif;font-size:14px;color:var(--muted)}
.t-new{width:100%;height:58px;border-radius:16px;background:var(--blue);color:#fff;font-family:'Jua',sans-serif;font-size:22px}
.t-item{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:6px;border-radius:18px;border:3px solid transparent;cursor:pointer;background:rgba(255,255,255,.5)}
.t-item.sel{border-color:var(--blue);background:#fff}
.t-mini{flex:1;min-width:0;height:62px}
.t-mini .blk-name{font-size:18px}
.t-mini .tag{font-size:12px}
.t-vis{flex:none;font-size:14px;padding:8px 10px;border-radius:12px;background:#fff;border:2px solid #DDE3EA;font-family:'Jua',sans-serif;line-height:1.2;width:74px}
.t-empty{color:var(--muted);font-size:15px;padding:6px 8px 4px}
.t-settings{margin-top:24px;padding:14px;background:#fff;border-radius:18px;display:flex;flex-direction:column;gap:12px;font-size:16px}
.t-settings label{display:flex;align-items:center;justify-content:space-between;gap:10px}
.t-settings select{font-size:17px;padding:6px 10px;border-radius:10px;border:2px solid #DDE3EA;font-family:inherit}
.t-editor{overflow-y:auto;padding:20px 26px 40px}
.t-blank{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:20px;gap:10px;text-align:center}
.t-blank .em{font-size:64px}
.ed-top{display:flex;align-items:center;gap:16px;margin-bottom:6px;flex-wrap:wrap}
.ed-top h2{margin:0;font-size:26px}
.t-preview{height:96px;width:min(100%,460px);margin:6px 0 18px}
.t-preview .blk-name{font-size:28px}
.fld{background:#fff;border-radius:20px;padding:16px 18px;margin-bottom:14px}
.fld>.lbl{font-family:'Jua',sans-serif;font-size:20px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.fld>.lbl .num{width:28px;height:28px;border-radius:50%;background:#2B2D33;color:#fff;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.fld .help{font-size:15px;color:var(--muted);margin-top:8px}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{flex:1;min-width:130px;padding:14px 12px;border-radius:16px;border:3px solid #DDE3EA;font-family:'Jua',sans-serif;font-size:20px;background:#F7F9FB;text-align:center}
.seg button.on{border-color:var(--blue);background:#EAF2FF;color:#1E56A8}
.seg button small{display:block;font-family:'Gowun Dodum',sans-serif;font-size:13px;color:var(--muted);margin-top:4px}
.txt{width:100%;font-size:22px;padding:12px 16px;border-radius:14px;border:3px solid #DDE3EA;outline:none}
.txt:focus{border-color:var(--blue)}
.photo-row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.photo-prev{width:110px;height:110px;border-radius:18px;overflow:hidden;background:#F3EFE6;display:flex;align-items:center;justify-content:center;font-size:64px;flex:none;border:3px solid #DDE3EA}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.photo-side{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px}
.photo-btns{display:flex;gap:10px;flex-wrap:wrap}
label.btn{cursor:pointer}
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px}
.emoji-grid button{width:46px;height:46px;font-size:28px;border-radius:12px;background:#F7F9FB;border:2px solid #E6EAF0}
.emoji-grid button.on{border-color:var(--blue);background:#EAF2FF}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swatches button{width:50px;height:50px;border-radius:50%;border:3px solid rgba(0,0,0,.08)}
.swatches button.on{box-shadow:0 0 0 3px #fff,0 0 0 6px #2B2D33}
.swatches .custom{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);margin-left:6px}
.swatches input[type=color]{width:50px;height:50px;border:none;padding:0;background:none;border-radius:12px;cursor:pointer}
.switch{display:inline-flex;align-items:center;gap:10px;font-family:'Jua',sans-serif;font-size:20px}
.switch .trk{width:74px;height:40px;border-radius:99px;background:#CBD2DB;position:relative;transition:.2s}
.switch .trk::after{content:'';position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.switch.on .trk{background:var(--green)}
.switch.on .trk::after{left:38px}
.switch b{font-weight:normal;min-width:40px;text-align:left}
.min-row{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.min-row input[type=range]{flex:1;min-width:180px;height:34px;accent-color:var(--blue)}
.pm{width:48px;height:48px;border-radius:14px;background:#F3EFE6;font-size:26px;font-family:'Jua',sans-serif}
.min-val{font-family:'Jua',sans-serif;font-size:32px;min-width:84px;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips button{padding:8px 14px;border-radius:99px;background:#F3EFE6;font-size:16px;font-family:'Jua',sans-serif}
.chips button.on{background:var(--blue);color:#fff}
.sub{margin-top:18px;padding-top:16px;border-top:2px dashed #E6EAF0}
.sub .lbl2{font-family:'Jua',sans-serif;font-size:18px;margin-bottom:10px}
.ed-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;position:sticky;bottom:-40px;padding:14px 0 6px;background:linear-gradient(transparent,#EEF1F5 30%)}
.ed-actions .btn{font-size:21px;padding:14px 26px}

@media (max-width:820px){
  .stage{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .palette{max-height:34vh}
  .world{grid-template-columns:110px minmax(0,1fr)}
  .controls{padding-left:0}
  .t-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .t-list{max-height:38vh;border-right:none;border-bottom:2px solid #DDE3EA}
  .big{font-size:22px;height:66px;padding:0 20px}
}

/* ---------- 연동 추가 ---------- */
.loading{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Jua',sans-serif;font-size:26px;color:var(--muted);text-align:center;padding:20px}
.loading .spin{width:54px;height:54px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--blue);animation:spin 1s linear infinite}
.loading small{font-family:'Gowun Dodum',sans-serif;font-size:16px}
@keyframes spin{to{transform:rotate(360deg)}}

.lv-status.p-act{background:#EAF2FF;color:#1E56A8}.lv-status.p-end{background:#FDEBE3;color:#B4471F}.lv-status.p-pause{background:#FBF2D9;color:#8A6A12}.lv-status.p-ready,.lv-status.p-fin{background:#E6F5EC;color:#1F7A4D}

.lv-bar{height:12px;border-radius:99px;background:#ECE8DF;overflow:hidden}

.lv-tower{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.lv-ctrl{display:flex;flex-wrap:wrap;gap:8px}
.lv-ctrl .btn{font-size:17px;padding:10px 14px}
.btn.go{background:var(--blue);color:#fff}.btn.ok{background:var(--green);color:#fff}.btn.warn{background:#E9B949;color:#3A2E00}
.st-wrap{padding:20px;max-width:860px}

.join-emo{font-size:64px;line-height:1}

.join-form .txt{flex:1;min-width:0}

.apk-link{font-size:15px;color:var(--blue);text-decoration:none;margin-top:4px}

/* ===== v5: 토막 칸 2열, 완성 시 토막 칸 숨기기 ===== */
.stage{display:flex;gap:22px;overflow:hidden}
.stage .palette{flex:0 0 min(40%,440px);min-width:300px;transition:margin-left .6s cubic-bezier(.45,0,.2,1),opacity .45s ease}
.stage .tower-area{flex:1;min-width:0}
.stage.fin .palette{margin-left:calc(-1 * max(min(40%,440px),300px) - 22px);opacity:0;pointer-events:none}
.stage.noanim .palette{transition:none}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plist .empty{grid-column:1/-1}
.pblk{height:68px}
.pblk .blk{border-radius:14px}
.pblk .blk-body{padding:4px 9px;gap:2px}
.pblk .blk-name{font-size:16px;line-height:1.15}
.pblk .tag{font-size:11px;padding:0 6px}
.palette h2{font-size:19px;margin:4px 4px 8px}

.tower-wrap:not(.hz) .world{grid-template-columns:160px minmax(0,470px)}
.sz-mid .sign span{font-size:22px}
.sz-long .sign span{font-size:20px;letter-spacing:-.5px;padding-right:20%}
.tower-wrap:not(.hz) .world.wide-signs{grid-template-columns:210px minmax(0,470px)}

.world.l-down::after{bottom:auto;top:6px}

@keyframes dropFromBelow{from{transform:translateY(90px);opacity:0}to{transform:none;opacity:1}}

.tower-wrap.hz{overflow-x:auto;overflow-y:hidden}
.world.l-right{display:block;position:relative;min-height:100%}

.l-right .signs{position:absolute;left:20px;right:20px;top:8px;height:64px}
.l-right .tower{position:absolute;left:20px;right:20px}
.l-right .tower::after{content:'';position:absolute;left:-12px;right:-12px;bottom:-16px;height:10px;background:#D8CFBC;border-radius:6px}

.l-right .sign span{height:100%;max-height:none;min-height:0;padding:6px 6px 0;align-items:flex-start;justify-content:center;font-size:22px;clip-path:polygon(0 0,100% 0,100% 68%,60% 68%,50% 100%,40% 68%,0 68%);box-shadow:none}

.l-right .floor .blk{flex-direction:column}
.l-right .floor .blk-img{width:100%;height:auto;flex:1 1 auto;aspect-ratio:auto}
.l-right .floor .blk-img .emo{font-size:52cqh}
.l-right .floor .blk-body{flex:0 0 auto;align-items:center;text-align:center;padding:8px 10px 12px}
.l-right .floor .blk-name{font-size:clamp(18px,2.1vw,26px)}
.l-right .floor.drop{animation:dropFromRight .5s cubic-bezier(.3,1.45,.5,1)}

.l-right .floor.leaving{animation:leaveUp .75s ease-in forwards}

.l-right .sign.sign-in{animation:signInDown .6s cubic-bezier(.3,1.5,.5,1) both}

.more.left{left:4px;top:auto;bottom:10px}

.next-card{position:absolute;top:16px;right:16px;z-index:3;background:#fff;border:3px solid var(--line);border-radius:22px;padding:12px 14px 14px;box-shadow:0 10px 26px rgba(0,0,0,.14);display:none;flex-direction:column;gap:6px;max-width:min(40vw,340px)}

.nc-time{font-family:'Jua',sans-serif;font-size:17px;color:#C9502A}

function normCode(c){return String(c||'').toUpperCase().replace(/\s+/g,'')}

var wq={};
function isWriting(k){var q=wq[k];return !!(q&&(q.busy||q.next))}
function anyWriting(prefix){for(var k in wq)if(k.indexOf(prefix)===0&&isWriting(k))return true;return false}
function enqueue(k,fn){
  var q=wq[k]||(wq[k]={busy:false,next:null});
  q.next=fn;updateConn();
  if(!q.busy)pump(k);
}
function pump(k){
  var q=wq[k];if(!q.next){q.busy=false;updateConn();afterWrite(k);return}
  var fn=q.next;q.next=null;q.busy=true;var tries=0;
  (function attempt(){
    Promise.resolve().then(fn).then(function(r){
      if(r&&r.error)throw r.error;
      if(r&&r.data===false)throw {code:'BADCODE'};
      ping();pump(k);
    }).catch(function(e){
      var code=e&&e.code;
      if(code!=='BADCODE'&&code!=='42501'&&code!=='23505'&&tries++<1){setTimeout(attempt,600+Math.random()*600);return}
      toast(code==='42501'?'선생님 로그인이 필요해요':code==='BADCODE'?'교실 코드가 맞지 않아요. 선생님께 확인해 주세요':'저장하지 못했어요. 인터넷 연결을 확인해 주세요');
      pump(k);
    });
  })();
}
function afterWrite(k){
  if(view==='student'&&k==='sessions/'+deviceSid){var ns=sessions[deviceSid];if(ns)applyRemote(ns)}
  if(pendingCount()===0)scheduleRefetch();
}
function pendingCount(){var n=0;for(var k in wq)if(isWriting(k))n++;return n}

/* ----- 세션 저장 ----- */
function persistSession(sid,s){
  var body={tower:s.tower,finalized:s.finalized,act:s.act,updatedAt:Date.now()};
  sessions[sid]=normSession(body);
  if(mode==='local')lsSet(LS_SESSION,JSON.stringify(body));
  else{var code=CLS.code;enqueue('sessions/'+sid,function(){return sb.rpc('tt_save_session',{p_code:code,p_student:sid,p_data:body})})}
  if(view==='teacher'&&T.tab==='live')renderLive();
}
function commitSession(){persistSession(deviceSid,S)}

/* ----- 블록 저장 (선생님) ----- */
function saveBlock(b){
  var c=cleanBlock(b);c.id=b.id;
  var i=-1;blocks.forEach(function(x,k){if(x.id===b.id)i=k});
  if(i>=0)blocks[i]=c;else blocks.push(c);
  if(mode==='local'){saveLocalBlocks();return}
  var cid=CLS.id,body=cleanBlock(b);
  enqueue('blocks/'+b.id,function(){return sb.from('blocks').upsert({classroom_id:cid,id:b.id,data:body,sort:body.order,updated_at:new Date().toISOString()})});
}
function deleteBlock(id){
  blocks=blocks.filter(function(x){return x.id!==id});
  if(mode==='local'){saveLocalBlocks();return}
  var cid=CLS.id;enqueue('blocks/'+id,function(){return sb.from('blocks').delete().match({classroom_id:cid,id:id})});
}
function saveLocalBlocks(){if(!lsSet(LS_BLOCKS,JSON.stringify({updatedAt:Date.now(),blocks:blocks})))toast('저장 공간이 부족해요. 사진 크기를 줄여 주세요')}

/* ----- 학생 저장 (선생님) ----- */
function saveStudent(st){
  var i=-1;students.forEach(function(x,k){if(x.id===st.id)i=k});
  if(i>=0)students[i]=st;else students.push(st);sortStudents();
  if(mode==='local')return;
  var cid=CLS.id;
  enqueue('students/'+st.id,function(){return sb.from('students').upsert({classroom_id:cid,id:st.id,name:String(st.name||'').slice(0,20),emoji:st.emoji||'🐊',sort:+st.order||0,settings:st.settings||{}})});
}
function deleteStudent(id){
  students=students.filter(function(x){return x.id!==id});delete sessions[id];
  if(mode==='local')return;
  var cid=CLS.id;enqueue('students/'+id,function(){return sb.from('students').delete().match({classroom_id:cid,id:id})});
}

function startLocal(){
  mode='local';
  var l=null;try{l=JSON.parse(lsGet(LS_BLOCKS))}catch(e){}
  var src=(l&&l.blocks&&(l.updatedAt||0)>(EMBED.updatedAt||0))?l.blocks:(EMBED.blocks||defaultBlocks());
  blocks=src.map(function(b,i){var c=cleanBlock(Object.assign({order:i},b));c.id=b.id;return c});
  var ls0=null;try{ls0=JSON.parse(lsGet(LS_SETTINGS))}catch(e){}

  sessions={local:normSession(s)};deviceSid='local';

/* ================= Supabase 연결 ================= */
function loadClass(code){return sb.rpc('tt_load',{p_code:code}).then(function(r){if(r.error)throw r.error;return r.data})}
function applyLoad(d,first){
  var nb=(d.blocks||[]).map(function(x){var c=cleanBlock(Object.assign({},x.data||{},{order:+x.sort||0}));c.id=x.id;return c});
  var ns=(d.students||[]).map(function(x){return {id:x.id,name:String(x.name||'학생'),emoji:String(x.emoji||'🐊'),order:+x.sort||0,settings:x.settings||{}}});
  var nss={};(d.sessions||[]).forEach(function(x){nss[x.student_id]=normSession(Object.assign({},x.data||{},{updatedAt:+x.updated_at||0}))});
  var bw=anyWriting('blocks/'),sw=anyWriting('students/');
  var chB=!bw&&JSON.stringify(nb)!==JSON.stringify(blocks),chS=!sw&&JSON.stringify(ns)!==JSON.stringify(students);
  if(!bw)blocks=nb;if(!sw){students=ns;sortStudents()}
  for(var k in sessions)if(isWriting('sessions/'+k))nss[k]=sessions[k];
  var chX=JSON.stringify(nss)!==JSON.stringify(sessions);sessions=nss;
  if(d.classroom)CLS.name=d.classroom.name;
  got={blocks:true,students:true,sessions:true};
  if(first)return;
  if(chB)onData('blocks');if(chS)onData('students');if(chX)onData('sessions');
}
var rfT=null,rfBusy=false,rfAgain=false;
function scheduleRefetch(){if(mode!=='cloud'||!CLS)return;clearTimeout(rfT);rfT=setTimeout(refetch,250)}
function refetch(){
  if(!CLS)return;if(rfBusy){rfAgain=true;return}rfBusy=true;
  var code=CLS.code;
  loadClass(code).then(function(d){if(!CLS||CLS.code!==code)return;if(!d){codeGone();return}if(connState==='warn'&&chanOK)setConn('on');applyLoad(d,false)})
    .catch(function(){setConn('warn')})
    .then(function(){rfBusy=false;if(rfAgain){rfAgain=false;scheduleRefetch()}});
}
function codeGone(){
  if(view==='teacher'){toast('교실 코드가 바뀌었어요');return}
  closeOverlay();unsubscribe();CLS=null;
  renderJoin('교실 코드가 바뀌었거나 교실이 없어졌어요. 선생님께 새 코드를 물어보세요.');
}
var chanOK=false;
function chanName(){
  var s=CLS.id+'|'+CLS.code;
  try{if(window.crypto&&crypto.subtle&&window.TextEncoder)return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(buf){return 'tt-'+Array.prototype.slice.call(new Uint8Array(buf),0,12).map(function(b){return ('0'+b.toString(16)).slice(-2)}).join('')})}catch(e){}
  var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Promise.resolve('tt-'+CLS.id+'-'+(h>>>0).toString(16));
}
function unsubscribe(){if(chan){try{sb.removeChannel(chan)}catch(e){}chan=null}chanOK=false}
function subscribe(){
  unsubscribe();var forCls=CLS;
  chanName().then(function(name){
    if(CLS!==forCls)return;
    chan=sb.channel(name,{config:{broadcast:{self:false}}});
    chan.on('broadcast',{event:'ping'},function(){scheduleRefetch()});
    chan.subscribe(function(st){
      if(st==='SUBSCRIBED'){chanOK=true;setConn('on');scheduleRefetch()}
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){chanOK=false;setConn('warn')}
    });
  });
}
function ping(){if(chan&&chanOK){try{chan.send({type:'broadcast',event:'ping',payload:{at:Date.now()}})}catch(e){}}}
setInterval(function(){if(mode==='cloud'&&CLS&&!document.hidden)scheduleRefetch()},30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)scheduleRefetch()});

function joinWith(code,after){
  code=normCode(code);
  renderLoading('교실에 연결하고 있어요…');
  loadClass(code).then(function(d){
    if(!d){if(lsGet(LS_CODE)===code)lsDel(LS_CODE);renderJoin('교실 코드를 찾을 수 없어요. 다시 확인해 주세요.');return}
    var changed=!CLS||CLS.id!==d.classroom.id;
    CLS={id:d.classroom.id,name:d.classroom.name,code:code};ownsClass=null;
    var prevCls=lsGet('tt-class-id-v1');if(prevCls&&prevCls!==d.classroom.id){deviceSid=null;lsDel(LS_DEVICE)}lsSet('tt-class-id-v1',d.classroom.id);
    lsSet(LS_CODE,code);mode='cloud';
    sessions={};applyLoad(d,true);subscribe();
    if(after)after();else route();
  }).catch(function(e){console.warn(e);renderJoin('연결하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.')});
}

var connState='';
function setConn(s){connState=s;updateConn()}
function updateConn(){
  var el=$('#conn');if(!el)return;
  var p=pendingCount();
  if(mode==='local'){el.className='conn warn';el.innerHTML='<i></i>이 기기에만 저장돼요';return}
  if(connState==='warn'){el.className='conn warn';el.innerHTML='<i></i>'+(p?'저장 중… (연결 불안정)':'연결이 불안정해요');return}
  el.className='conn on';el.innerHTML='<i></i>'+(p?'저장 중…':esc(CLS?CLS.name:'')+' 연결됨');
}

  if(!(got.blocks&&got.students&&got.sessions))return;
  if(ssGet(SS_TEACHER)&&(mode==='local'||teacherUser)){openTeacher();return}
  if(deviceSid&&getStudent(deviceSid))enterStudent();else renderPick();
}

function ac(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C()}if(actx.state==='suspended')actx.resume().catch(function(){});return actx}catch(e){return null}}
function tone(f,t0,dur,vol){var a=ac();if(!a)return;var t=a.currentTime+t0;[[1,vol],[2,vol*.25],[3,vol*.08]].forEach(function(h){var o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f*h[0];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(h[1],t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05)})}

function fmt(ms){var s=Math.ceil(ms/1000),m=Math.floor(s/60);s=s%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function actRem(a){if(!a||!a.total)return null;return a.pausedRem!=null?Math.max(0,a.pausedRem):Math.max(0,a.endAt-Date.now())}
function actPhase(a){if(!a)return 'none';if(!a.total)return 'free';if(a.pausedRem!=null)return 'pause';return actRem(a)>0?'run':'end'}
/* 수업 활동: 수업 시간 블록 안에서 순서대로 하는 작은 활동들 */
function blockActs(b){return b&&b.type==='class'&&Array.isArray(b.acts)?b.acts:[]}
function actMinutesSum(b){return blockActs(b).reduce(function(t,x){return t+(x.timerOn?+x.minutes||0:0)},0)}
function isActMode(a,b){return !!(a&&a.ai!=null&&blockActs(b).length)}
function actStep(a,b,ai,now){var x=blockActs(b)[ai],total=x&&x.timerOn?clamp(+x.minutes||1,1,60)*60000:0;return {uid:a.uid,blockId:a.blockId,ai:ai,startedAt:now,total:total,endAt:now+total,pausedRem:null}}
function advanceAct(a){var b=getBlock(a.blockId),n=blockActs(b).length;return actStep(a,b,Math.min((a.ai||0)+1,n-1),Date.now())}
function actLabel(st,b,i,n){
  if(b&&b.actStyle==='number')return {t:numLabel(i+1,st.numFormat),c:numColor(st,i+1)};
  var k=st.words.length;
  if(n>1&&i===n-1&&st.lastLabel)return {t:st.lastLabel,c:st.lastColor||LAST_COLOR};
  if(!k)return {t:String(i+1),c:'#5B7083'};
  var j=Math.min(i,k-1);return {t:st.words[j],c:wordColor(st,j)};
}
function makeAct(it,b){
  var now=Date.now();
  if(blockActs(b).length)return actStep(it,b,0,now);
  var total=b&&b.timerOn?clamp(+b.minutes||1,1,60)*60000:0;return {uid:it.uid,blockId:it.blockId,startedAt:now,total:total,endAt:now+total,pausedRem:null,ai:null};
}

var RAINBOW=['#E53935','#FB8C00','#FDD835','#43A047','#1E88E5','#3949AB','#8E24AA'];
var DEFAULT_NUM_COLORS=['#2E9E6A','#3B7DD8','#8A5CC9','#C9822E','#2E8F9E','#B0507A'];
var DEFAULT_SET={layout:'up',signStyle:'words',words:['먼저','다음에','나중에'],wordColors:['#2E9E6A','#3B7DD8','#8A5CC9'],lastLabel:'마지막',lastColor:'#E2683C',numFormat:'num',numColorMode:'custom',numSolid:'#3B7DD8',numColors:DEFAULT_NUM_COLORS.slice()};
var WORD_COLORS=['#2E9E6A','#3B7DD8','#8A5CC9','#C9822E','#2E8F9E','#B0507A','#5B7083','#7A9E2E'];
var LAST_COLOR='#E2683C';
function normSettings(x){
  x=x||{};var s=clone(DEFAULT_SET);
  if(['up','down','right'].indexOf(x.layout)>=0)s.layout=x.layout;
  if(['words','number'].indexOf(x.signStyle)>=0)s.signStyle=x.signStyle;
  if(Array.isArray(x.words))s.words=x.words.map(function(w){return String(w||'').trim().slice(0,12)}).filter(function(w){return w}).slice(0,8);
  if(typeof x.lastLabel==='string')s.lastLabel=x.lastLabel.trim().slice(0,12);
  if(Array.isArray(x.words)&&Array.isArray(x.wordColors)){
    var wc=[];x.words.forEach(function(w,i){if(String(w||'').trim())wc.push(x.wordColors[i])});
    s.wordColors=wc.slice(0,8).map(function(c,i){return /^#[0-9a-fA-F]{6}$/.test(c||'')?c:WORD_COLORS[i%WORD_COLORS.length]});
  }else if(Array.isArray(x.words))s.wordColors=s.words.map(function(w,i){return WORD_COLORS[i%WORD_COLORS.length]});
  if(/^#[0-9a-fA-F]{6}$/.test(x.lastColor||''))s.lastColor=x.lastColor;
  if(['rainbow','solid','custom'].indexOf(x.numColorMode)>=0)s.numColorMode=x.numColorMode;
  if(/^#[0-9a-fA-F]{6}$/.test(x.numSolid||''))s.numSolid=x.numSolid;
  if(Array.isArray(x.numColors)&&x.numColors.length)s.numColors=x.numColors.slice(0,99).map(function(c,i){return /^#[0-9a-fA-F]{6}$/.test(c||'')?c:DEFAULT_NUM_COLORS[i%DEFAULT_NUM_COLORS.length]});
  if(['num','ordinal','activity'].indexOf(x.numFormat)>=0)s.numFormat=x.numFormat;
  return s;
}
function wordColor(st,i){return (st.wordColors&&st.wordColors[i])||WORD_COLORS[i%WORD_COLORS.length]}
function numColor(st,ord){
  if(st.numColorMode==='rainbow')return RAINBOW[(ord-1)%RAINBOW.length];
  if(st.numColorMode==='solid')return st.numSolid;
  var a=st.numColors&&st.numColors.length?st.numColors:DEFAULT_NUM_COLORS;return a[(ord-1)%a.length];
}
function getSettings(sid){var st=getStudent(sid);return normSettings(st&&st.settings)}
function curSet(){return getSettings(deviceSid)}
var KOR_ORD=['첫','두','세','네','다섯','여섯','일곱','여덟','아홉','열'];
function numLabel(n,f){if(f==='ordinal')return (n<=10?KOR_ORD[n-1]:n)+' 번째';if(f==='activity')return n+'번 활동';return String(n)}

/* ----- 표지판 -----
   first-then: 쌓는 동안엔 설정한 문구(먼저/다음에/나중에…), 완성 후엔 맨 위 블록에 '마지막'이 붙고
               탑이 줄어들면 '마지막'이 블록과 함께 내려오며 문구가 뒤에서부터 차례로 사라져요.
   숫자: 블록마다 몇 번째 활동인지 붙고, 다 했어요를 누르면 그 블록의 번호도 함께 사라져요. */
var prevSigns=null,prevPoleH=null;
function signSpec(n,fin,st){
  var out=[],i;
  if(st.signStyle==='number'){
    for(i=0;i<n;i++){var it=S.tower[i],ord=fin&&it.ord?it.ord:i+1;out.push({key:'u'+it.uid,i:i,t:numLabel(ord,st.numFormat),c:numColor(st,ord)})}
    return out;
  }
  var w=st.words,k=w.length;
  if(!fin){for(i=0;i<k;i++)out.push({key:'f'+i,i:i,t:w[i],c:wordColor(st,i)});return out}
  var lastOn=!!st.lastLabel&&n>0,upto=lastOn?n-1:n;
  for(i=0;i<Math.min(k,upto);i++)out.push({key:'f'+i,i:i,t:w[i],c:wordColor(st,i)});
  if(lastOn)out.push({key:'last',i:n-1,t:st.lastLabel,c:st.lastColor||LAST_COLOR,last:true});
  return out;
}
function lenCls(t){var l=String(t).length;return l<=3?'':l<=5?' s-mid':' s-long'}
function renderSigns(box,n,g,st){
  var spec=signSpec(n,S.finalized,st),animate=!!prevSigns,html='',map={};
  function el(sp,cls,i){return '<div class="sign'+(sp.last?' last':'')+(cls?' '+cls:'')+'" data-key="'+esc(sp.key)+'" style="'+g.pos(i)+';--sc:'+sp.c+';--sf:'+fgFor(sp.c)+'"><span>'+esc(sp.t)+'</span></div>'}
  spec.forEach(function(sp){var pv=prevSigns&&prevSigns[sp.key];map[sp.key]=sp;html+=el(sp,animate&&!pv?'sign-in':'',sp.i)});
  if(animate)for(var k in prevSigns)if(!map[k])html+=el(prevSigns[k],'sign-out',prevSigns[k].i);
  var ml=Math.max.apply(0,[0].concat(spec.map(function(x){return String(x.t).length})));
  box.className='signs'+(ml<=3?'':ml<=5?' sz-mid':' sz-long');if(box.parentNode)box.parentNode.classList.toggle('wide-signs',ml>5);
  var top=spec.length?Math.max.apply(0,spec.map(function(x){return x.i})):-1;
  var poleH=g.hz||top<0?0:top*g.step+g.size*.75+14;
  box.innerHTML=(g.hz?'':'<div class="pole" style="height:'+(animate&&prevPoleH!=null?prevPoleH:poleH)+'px"></div>')+html;
  if(!g.hz){var pole=box.firstChild;void pole.offsetHeight;pole.style.height=poleH+'px'}
  if(animate)spec.forEach(function(sp){
    var pv=prevSigns[sp.key];if(!pv||pv.i===sp.i)return;
    var e=box.querySelector('.sign[data-key="'+sp.key+'"]:not(.sign-out)');if(!e)return;
    e.style.transition='none';e.style.transform=g.offset(pv.i-sp.i);void e.offsetHeight;
    e.style.transition='transform .6s cubic-bezier(.3,1.35,.5,1)';e.style.transform='';
  });
  setTimeout(function(){[].forEach.call(box.querySelectorAll('.sign-out'),function(x){x.remove()})},650);
  prevSigns=map;prevPoleH=poleH;
}

/* ----- 탑 배치: up(아래→위) / down(위→아래) / right(왼쪽→오른쪽) ----- */
function towerGeom(vp,L,slots){
  var PAD=16,HEAD=26,g={L:L,hz:L==='right'};
  if(g.hz){
    var W=vp.clientWidth||800,H=vp.clientHeight||500,SIGN=64;
    var fw=Math.max(130,Math.min(230,(W-40-GAP*VIEW_FLOORS)/(VIEW_FLOORS+.3)));
    g.size=fw;g.step=fw+GAP;g.signRow=SIGN;
    g.blockH=Math.max(140,Math.min(H-SIGN-HEAD-34,fw*1.35));
    g.len=Math.max(W,Math.max(slots,1)*g.step-GAP+40);
    g.pos=function(i){return 'left:'+(i*g.step)+'px;width:'+fw+'px'};
    g.offset=function(d){return 'translateX('+(d*g.step)+'px)'};
  }else{
    var H2=vp.clientHeight||500;
    var fh=Math.max(46,Math.min(120,(H2-PAD-HEAD-GAP*VIEW_FLOORS)/(VIEW_FLOORS+.35)));
    g.size=fh;g.step=fh+GAP;
    g.len=Math.max(H2,Math.max(slots,3)*g.step-GAP+PAD+HEAD);
    if(L==='down'){g.pos=function(i){return 'top:'+(HEAD+i*g.step)+'px;height:'+fh+'px'};g.offset=function(d){return 'translateY('+(d*g.step)+'px)'}}
    else{g.pos=function(i){return 'bottom:'+(i*g.step)+'px;height:'+fh+'px'};g.offset=function(d){return 'translateY('+(-d*g.step)+'px)'}}
  }
  return g;
}
function vpPos(vp){return vp._hz?vp.scrollLeft:vp.scrollTop}
function vpSet(vp,v){if(vp._hz)vp.scrollLeft=v;else vp.scrollTop=v}
function vpSize(vp){return vp._hz?vp.scrollWidth:vp.scrollHeight}
function vpMax(vp){return vp._hz?vp.scrollWidth-vp.clientWidth:vp.scrollHeight-vp.clientHeight}
function renderTower(opts){
  opts=opts||{};
  var vp=$('#tower-wrap'),world=$('#world'),tower=$('#tower'),signs=$('#signs');if(!vp)return;
  var st=curSet(),L=st.layout;
  var n=S.tower.length;
  var slots=S.finalized?n:Math.min(MAX_FLOORS,Math.max(VIEW_FLOORS,n+1));
  var before=L==='up'?vpSize(vp)-vpPos(vp):vpPos(vp);
  var g=towerGeom(vp,L,slots);
  if(g.hz){world.style.width=g.len+'px';world.style.height='100%';tower.style.height=g.blockH+'px';tower.style.top=(g.signRow+26)+'px'}
  else{world.style.height=g.len+'px';world.style.width=''}
  renderSigns(signs,n,g,st);
  var i,showNum=!g.hz&&st.signStyle==='words',k=st.words.length;
  if(S.finalized&&!n){tower.innerHTML='<div class="celebrate"><div class="cele-emo">🎉</div><div>오늘 시간표를<br>모두 마쳤어요!</div></div>';if(g.hz)world.style.width=vp.clientWidth+'px';else world.style.height=vp.clientHeight+'px';vpSet(vp,0);updateMore();return}
  var h='';
  for(i=0;i<slots;i++){
    var it=S.tower[i],num=(showNum&&i>=k&&!(S.finalized&&i===n-1&&st.lastLabel))?'<span class="fnum">'+(i+1)+'</span>':'';
    if(it){var b=getBlock(it.blockId);
      h+='<div class="floor'+(opts.dropIdx===i?' drop':'')+(S.finalized&&i===0?' now':'')+'" data-idx="'+i+'" style="'+g.pos(i)+'">'+num+blockHTML(b,true)+(S.finalized?'':'<button class="rm" data-act="rm" data-idx="'+i+'" aria-label="빼기">✕</button>')+'</div>';
    }else{var nx=i===n;h+='<div class="slot'+(nx?' next':'')+'" style="'+g.pos(i)+'">'+num+(nx?'여기에 쌓아요':'')+'</div>'}
  }
  tower.innerHTML=h;
  if(opts.shift){
    var fl=[].slice.call(tower.querySelectorAll('.floor')).filter(function(e){return +e.dataset.idx>=(opts.shiftFrom||0)});
    fl.forEach(function(e){e.style.transition='none';e.style.transform=g.offset(1)});
    void tower.offsetHeight;
    fl.forEach(function(e){e.style.transition='transform .6s cubic-bezier(.3,1.35,.5,1)';e.style.transform=''});
  }
  // 시점: 쌓는 동안엔 새 블록 쪽, 완성 후엔 지금 할 일(첫 블록) 쪽
  var target=S.finalized?(L==='up'?vpMax(vp):0):(L==='up'?0:vpMax(vp));
  cancelAnimationFrame(vp._raf);
  if(opts.instant)vpSet(vp,target);
  else{vpSet(vp,L==='up'?vpSize(vp)-before:before);if(!opts.keep)glide(vp,target)}
  setTimeout(updateMore,50);
}
function glide(vp,target,dur){
  cancelAnimationFrame(vp._raf);var from=vpPos(vp),t0=performance.now();dur=dur||650;
  (function step(now){var k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);vpSet(vp,from+(target-from)*e);if(k<1)vp._raf=requestAnimationFrame(step);else updateMore()})(t0);
}
function updateMore(){
  var vp=$('#tower-wrap'),u=$('#more-a'),d=$('#more-b');if(!vp||!u)return;
  var max=vpMax(vp),p=vpPos(vp);
  u.classList.toggle('show',p>8);d.classList.toggle('show',p<max-8);
}
function renderControls(){
  var c=$('#controls');if(!c)return;var n=S.tower.length;
  if(!S.finalized)c.innerHTML='<button class="big b-soft" data-act="clear"'+(n?'':' disabled')+'>↺ 다시 쌓기</button><button class="big b-complete" data-act="finalize"'+(n?'':' disabled')+'>⭐ 오늘의 시간표 완성</button>';

function addToTower(id){

function removeFloor(i){S.tower.splice(i,1);commitSession();renderTower({shift:true,shiftFrom:i});renderControls()}
function finalizeSession(s){s.finalized=true;s.tower.forEach(function(it,i){it.ord=i+1});return s}

/* 다 했어요 애니메이션 (내가 누르든, 선생님이 누르든) */
var busy=false,pendingRemote=null;
function animateLeave(cb){var f=$('#tower .floor[data-idx="0"]');doneSound();if(f)f.classList.add('leaving');setTimeout(cb,750)}
function doDone(){
  if(busy||!S.tower.length)return;busy=true;
  var first=S.tower[0];
  animateLeave(function(){
    S.tower.shift();if(S.act&&S.act.uid===first.uid)S.act=null;
    commitSession();busy=false;
    if(!S.tower.length)cheerSound();
    renderTower({shift:true,shiftFrom:0});renderControls();
    flushPending();
  });
}
function flushPending(){if(pendingRemote&&!isWriting('sessions/'+deviceSid)){var p=pendingRemote;pendingRemote=null;applyRemote(p)}else pendingRemote=null}
function applyRemote(ns){
  if(view!=='student')return;
  ns=normSession(ns);
  if(busy){pendingRemote=ns;return}
  var old=S;if(sameSession(old,ns))return;
  S=ns;
  var isDone=old.finalized&&ns.finalized&&old.tower.length&&ns.tower.length===old.tower.length-1&&ns.tower.every(function(it,i){return it.uid===old.tower[i+1].uid});
  syncOverlay(old.act,ns.act);
  if(old.finalized!==ns.finalized){applyFinUI();if(ns.finalized&&ns.tower.length)cheerSound()}
  else if(isDone){busy=true;animateLeave(function(){busy=false;if(!S.tower.length)cheerSound();renderTower({shift:true,shiftFrom:0});renderControls();flushPending()})}
  else{renderPalette();renderTower();renderControls()}
}

/* 끌어서 쌓기 */
var drag=null;
function overTower(e){var w=$('#tower-wrap');if(!w)return false;var r=w.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom}
function endDrag(){if(!drag)return;if(drag.ghost)drag.ghost.remove();drag.el.classList.remove('dragging-src');var w=$('#tower-wrap');if(w)w.classList.remove('dragover');drag=null}
document.addEventListener('pointerdown',function(e){var p=e.target.closest&&e.target.closest('.pblk');if(!p||S.finalized||(e.button&&e.button>0))return;drag={id:p.dataset.id,x:e.clientX,y:e.clientY,el:p,ghost:null,pid:e.pointerId}});
window.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.pid)return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<12)return;
    var r=drag.el.getBoundingClientRect(),g=drag.el.cloneNode(true);
    g.className='ghost';g.style.width=r.width+'px';g.style.height=r.height+'px';document.body.appendChild(g);
    drag.ghost=g;drag.ox=drag.x-r.left;drag.oy=drag.y-r.top;drag.el.classList.add('dragging-src');
  }
  drag.ghost.style.transform='translate('+(e.clientX-drag.ox)+'px,'+(e.clientY-drag.oy)+'px) rotate(-2deg)';
  var w=$('#tower-wrap');if(w)w.classList.toggle('dragover',overTower(e));
  e.preventDefault();
},{passive:false});
window.addEventListener('pointerup',function(e){
  if(!drag||e.pointerId!==drag.pid)return;
  var d=drag,wasDrag=!!d.ghost,over=overTower(e);endDrag();
  if(!wasDrag||over)addToTower(d.id);
});
window.addEventListener('pointercancel',endDrag);

/* ================= 수업/쉬는 시간 화면 ================= */
var ov=null;
function pt(r,a){var rad=(a-90)*Math.PI/180;return [110+r*Math.cos(rad),110+r*Math.sin(rad)]}
function wedge(a0,a1){var r=98;if(a1-a0<=.05)return '';if(a1-a0>=359.95)return 'M110,12 A98,98 0 1 1 109.99,12 Z';var p0=pt(r,a0),p1=pt(r,a1);return 'M110,110 L'+p0[0].toFixed(2)+','+p0[1].toFixed(2)+' A98,98 0 '+(a1-a0>180?1:0)+' 1 '+p1[0].toFixed(2)+','+p1[1].toFixed(2)+' Z'}
function analogSVG(n){
  n=clamp(Math.round(n)||1,1,60);
  var t='';for(var k=0;k<n;k++){var a=k/n*360,major=n<=12||k%5===0,p1=pt(major?84:90,a),p2=pt(97,a);t+='<line x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'" stroke="#2B2D33" stroke-opacity=".55" stroke-width="'+(major?3:1.2)+'" stroke-linecap="round"/>'}
  return '<svg class="analog" viewBox="0 0 220 220" aria-hidden="true"><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ECE8DF"/><rect width="4" height="10" fill="#D6D0C2"/></pattern></defs><circle cx="110" cy="110" r="107" fill="#2B2D33"/><circle cx="110" cy="110" r="98" fill="#fff"/><path id="an-el" fill="url(#hatch)"/><path id="an-rem" style="fill:var(--cd)"/>'+t+'<line id="an-hand" x1="110" y1="110" x2="110" y2="16" stroke="#2B2D33" stroke-width="4" stroke-linecap="round"/><circle cx="110" cy="110" r="9" fill="#2B2D33"/></svg>';
}
function syncOverlay(oa,na){
  if(view!=='student')return;
  if(!na){closeOverlay();return}
  var fresh=!oa||oa.uid!==na.uid||oa.startedAt!==na.startedAt;
  if(ov&&ov.act.uid===na.uid&&na.ai!=null&&ov.act.ai!==na.ai){closeOverlay();openOverlay(na,'next');return}
  if(!ov||ov.act.uid!==na.uid||ov.act.startedAt!==na.startedAt){closeOverlay();openOverlay(na,fresh);return}
  ov.act=na;updateTimer();
}
function openOverlay(a,withSound){
  var b=getBlock(a.blockId)||{name:'',type:'class',color:'#D9E4EC',img:{}};
  if(withSound==='next')transitionSound();else if(withSound)startSound();
  var isClass=b.type==='class',timed=a.total>0,tt=b.timerType||'analog',c=okColor(b.color);
  var am=isActMode(a,b),acts=blockActs(b),acHTML='';
  if(am){
    var st=curSet(),ai=clamp(a.ai,0,acts.length-1),cl=actLabel(st,b,ai,acts.length);
    acHTML='<div class="ac-wrap"><div class="ac-strip">'+acts.map(function(x,i){var l=actLabel(st,b,i,acts.length);return '<span class="ac-chip'+(i<ai?' done':i===ai?' cur':'')+'"><i style="--sc:'+l.c+';--sf:'+fgFor(l.c)+'">'+esc(l.t)+'</i>'+esc(x.name)+(i<ai?' ✓':'')+'</span>'}).join('')+'</div>'+
      '<div class="ac-now"><span class="ac-sign" style="--sc:'+cl.c+';--sf:'+fgFor(cl.c)+'">'+esc(cl.t)+'</span><span class="ac-name">'+esc(acts[ai].name)+'</span></div></div>';
  }
  var kind=isClass?'📚 수업 시간':'🧸 쉬는 시간';
  var timerHTML='';
  if(timed){
    var an=tt==='analog'||tt==='both',dg=tt==='digital'||tt==='both';
    timerHTML='<div class="act-timer'+(tt==='both'?' both':'')+'">'+
      (an?'<div class="an-box">'+analogSVG(a.total/60000)+'<div class="legend"><span><i class="sw" style="background:var(--cd)"></i>남은 시간 <b id="an-left"></b></span><span><i class="sw hatch"></i>지나간 시간</span></div></div>':'')+
      (dg?'<div class="digital"><div class="dg-label">남은 시간</div><div class="dg-time" id="dg"></div></div>':'')+'</div>';
  }
  var el=document.createElement('div');
  el.className='activity '+(timed?'timed':'untimed')+(am?' am':'');
  el.style.setProperty('--c',c);el.style.setProperty('--cd',vivid(c));el.style.setProperty('--fg',fgFor(c));
  el.innerHTML='<button class="act-close" data-act="act-close">✕ 그만하고 돌아가기</button>'+
    '<div class="act-kind">'+kind+'</div><div class="act-blk"><div class="im">'+imgInner(b)+'</div><span>'+esc(b.name)+'</span></div>'+acHTML+
    timerHTML+'<div class="act-msg" id="act-msg"></div><div class="act-actions" id="act-actions"></div><div class="next-card" id="next-card" aria-live="polite"></div>'+
    (withSound==='next'?'<div class="ac-banner">▶ 다음 활동을 해요!</div>':'');
  document.body.appendChild(el);
  ov={el:el,act:a,phase:null,timer:null,lvl:0,am:am,last:!am||a.ai>=acts.length-1,adv:false};
  updateTimer(true);
  if(timed)ov.timer=setInterval(function(){updateTimer()},200);
}
function updateTimer(initial){
  if(!ov)return;var a=ov.act,ph=actPhase(a);
  if(a.total){
    var rem=actRem(a),ea=(1-rem/a.total)*360;
    var e1=$('#an-el'),e2=$('#an-rem'),hd=$('#an-hand'),lf=$('#an-left'),dg=$('#dg');
    if(e1){e1.setAttribute('d',wedge(0,ea));e2.setAttribute('d',wedge(ea,360));hd.setAttribute('transform','rotate('+ea.toFixed(2)+' 110 110)')}
    if(lf)lf.textContent=rem<=0?'0분':rem>=60000?'약 '+Math.ceil(rem/60000)+'분':Math.ceil(rem/1000)+'초';
    if(dg)dg.innerHTML=fmt(rem).split('').map(function(ch){return '<i'+(ch===':'?' class="colon"':'')+'>'+ch+'</i>'}).join('');
    noticeCheck(rem,initial);
  }
  // 시간을 정한 활동이 끝나면 다음 활동으로 저절로 넘어가요 (학생 태블릿이 넘겨요)
  if(ov.am&&!ov.last&&ph==='end'&&!ov.adv&&view==='student'){
    ov.adv=true;var a0=a;
    setTimeout(function(){if(!ov||ov.act!==a0||!S.act||S.act.uid!==a0.uid||S.act.ai!==a0.ai||S.act.startedAt!==a0.startedAt)return;var o=S.act;S.act=advanceAct(o);commitSession();syncOverlay(o,S.act)},1000);
  }
  if(ph!==ov.phase){
    if(ph==='end'&&ov.phase==='run'&&!initial&&ov.last)endSound();
    ov.phase=ph;
    ov.el.classList.toggle('ended',ph==='end');
    var msg=$('#act-msg'),acts=$('#act-actions');
    msg.className='act-msg'+(ph==='pause'?' ov-pause':'');
    msg.textContent=ph==='end'?(ov.am&&!ov.last?'⏰ 시간이 다 되었어요! 다음 활동으로 넘어가요':ov.am?'🎉 수업 활동을 모두 마쳤어요!':'⏰ 시간이 다 되었어요!'):ph==='pause'?'⏸ 잠깐 멈췄어요':'';
    if(ov.am&&!ov.last)acts.innerHTML=ph==='free'?'<button class="big b-start" data-act="act-next">▶ 다음 활동을 해요</button>':'';
    else acts.innerHTML=(ph==='end'||ph==='free')?'<button class="big b-soft" data-act="act-back">↩ 돌아가기</button><button class="big b-done" data-act="act-done">✓ 다 했어요</button>':'';
  }
}
/* 5분·1분 남았을 때: 작은 알림 소리 + 오른쪽 위에 '다음 활동이에요' (마지막 활동이면 안내하지 않아요) */
function nextBlockFor(a){var i=-1;S.tower.forEach(function(it,k){if(it.uid===a.uid)i=k});var nx=i>=0?S.tower[i+1]:null;return nx?getBlock(nx.blockId):null}
function noticeSound(){tone(783.99,0,.6,.11);tone(1046.5,.2,.8,.11)}
function transitionSound(){tone(659.25,0,.5,.16);tone(880,.16,.8,.16)}
function noticeCheck(rem,initial){
  var a=ov.act,b=getBlock(a.blockId)||{};
  // 쉬는 시간과 수업 활동은 1분 전에만, 활동 없는 수업 시간은 5분·1분 전에 알려요
  var th=(ov.am||b.type==='break'?[60000]:[300000,60000]).filter(function(t){return a.total>t});
  var lvl=th.filter(function(t){return rem<=t}).length;
  if(lvl<=ov.lvl)return;ov.lvl=lvl;
  var card=$('#next-card');if(!card)return;var inner='';
  if(ov.am&&!ov.last){
    var acts=blockActs(b),l=actLabel(curSet(),b,a.ai+1,acts.length),c2=okColor(b.color);
    inner='<div class="nc-blk" style="--c:'+c2+';--fg:'+fgFor(c2)+'"><span class="nc-sign" style="--sc:'+l.c+';--sf:'+fgFor(l.c)+'">'+esc(l.t)+'</span><span>'+esc(acts[a.ai+1].name)+'</span></div>';
  }else{
    var nb=nextBlockFor(a);if(!nb)return;
    var c=okColor(nb.color);
    inner='<div class="nc-blk" style="--c:'+c+';--fg:'+fgFor(c)+'"><div class="im">'+imgInner(nb)+'</div><span>'+esc(nb.name)+'</span></div>';
  }
  card.innerHTML='<div class="nc-time">⏰ '+(rem<=60000?'1분':'5분')+' 남았어요</div><div class="nc-title">다음 활동이에요</div>'+inner;
  card.classList.remove('show');void card.offsetWidth;card.classList.add('show');
  if(!initial)noticeSound();
}
function closeOverlay(){if(!ov)return;clearInterval(ov.timer);ov.el.remove();ov=null}
function startHere(){
  if(!S.tower.length||S.act)return;
  var it=S.tower[0],b=getBlock(it.blockId);if(!b)return;
  S.act=makeAct(it,b);commitSession();openOverlay(S.act,true);
}

function pwKey(v){

/* ----- 실시간 보기 ----- */
function phaseOf(s){if(!s.finalized)return s.tower.length?'build':'idle';if(!s.tower.length)return 'fin';return s.act?{none:'ready',free:'act',run:'act',pause:'pause',end:'end'}[actPhase(s.act)]:'ready'}
var livePhases={};
function ago(t){if(!t)return '';var s=Math.round((Date.now()-t)/1000);if(s<10)return '방금 전';if(s<60)return s+'초 전';if(s<3600)return Math.floor(s/60)+'분 전';return Math.floor(s/3600)+'시간 전'}
function liveCard(st){
  var s=sessions[st.id]||emptySession(),n=s.tower.length,ph=phaseOf(s),a=s.act;
  var cur=n?getBlock(s.tower[0].blockId):null;
  livePhases[st.id]=ph+(a&&a.ai!=null?'#'+a.ai:'');
  var status={idle:'⏳ 아직 시간표를 쌓지 않았어요',build:'🧱 시간표 쌓는 중 · '+n+'층',ready:'✅ 시간표 완성 · 시작 전',fin:'🎉 오늘 시간표를 모두 마쳤어요',act:(cur&&cur.type!=='class'?'🧸 쉬는 시간':'📚 수업 시간')+' 진행 중',pause:'⏸ 잠깐 멈춤',end:'⏰ 시간이 다 되었어요'}[ph];
  var nowHTML='';
  if(s.finalized&&cur){
    var timed=a&&a.total;
    var lacts=blockActs(cur),lam=isActMode(a,cur);
    nowHTML='<div class="lv-now"><div class="mini">'+blockHTML(cur)+'</div>'+(timed?'<div class="lv-time" data-sid="'+esc(st.id)+'">'+fmt(actRem(a))+'</div>':'')+'</div>'+
      (lam?'<div class="lv-acts">'+lacts.map(function(x,i){return '<span class="'+(i<a.ai?'done':i===a.ai?'cur':'')+'">'+(i+1)+'. '+esc(x.name)+(i<a.ai?' ✓':'')+'</span>'}).join('')+'</div>':'')+
      (timed?'<div class="lv-bar"><i data-bar="'+esc(st.id)+'" style="width:'+(100*actRem(a)/a.total).toFixed(1)+'%"></i></div>':'');
  }
  var chips=s.tower.map(function(it,i){var b=getBlock(it.blockId)||{name:'?',color:'#D9E4EC'};var c=okColor(b.color);return '<span class="lv-chip'+(s.finalized&&i===0?' cur':'')+'" style="--c:'+c+';--fg:'+fgFor(c)+'"><span class="n">'+(i+1)+'</span>'+esc(b.name)+'</span>'}).join('');
  var sid=esc(st.id),B=function(act,cls,label){return '<button class="btn '+cls+'" data-act="'+act+'" data-id="'+sid+'">'+label+'</button>'};
  var ctrl='',nextAct=(a&&cur&&isActMode(a,cur)&&a.ai<blockActs(cur).length-1)?B('t-nextact','go','⏭ 다음 활동'):'';
  if(ph==='build')ctrl=B('t-finalize','primary','⭐ 완성 처리')+B('t-clear','ghost-btn','🧹 비우기');
  else if(ph==='ready')ctrl=B('t-start','go','▶ 시작')+B('t-done','ok','✓ 다 했어요')+B('t-clear','ghost-btn','🧹 비우기');
  else if(ph==='act')ctrl=nextAct+(a.total?B('t-pause','warn','⏸ 일시정지')+B('t-plus','ghost-btn','＋1분'):'')+B('t-stop','ghost-btn','⏹ 멈추기')+B('t-done','ok','✓ 다 했어요');
  else if(ph==='pause')ctrl=nextAct+B('t-resume','go','▶ 계속')+B('t-plus','ghost-btn','＋1분')+B('t-stop','ghost-btn','⏹ 멈추기')+B('t-done','ok','✓ 다 했어요');
  else if(ph==='end')ctrl=nextAct+B('t-plus','ghost-btn','＋1분 더')+B('t-stop','ghost-btn','⏹ 닫기')+B('t-done','ok','✓ 다 했어요');
  else if(ph==='fin')ctrl=B('t-clear','primary','🏗️ 새 시간표');
  return '<div class="lv-card p-'+ph+'"><div class="lv-head"><span class="emo">'+esc(st.emoji)+'</span><b>'+esc(st.name)+'</b><span class="ago" data-ago="'+sid+'">'+ago(s.updatedAt)+'</span></div>'+
    '<div class="lv-status p-'+ph+'">'+status+'</div>'+nowHTML+(chips?'<div class="lv-tower">'+chips+'</div>':'')+(ctrl?'<div class="lv-ctrl">'+ctrl+'</div>':'')+'</div>';
}
function renderLive(){
  var m=$('#t-main');if(!m||T.tab!=='live')return;
  if(!students.length){m.innerHTML='<div class="t-blank"><div class="em">👧</div><div>학생이 없어요.<br>👧 학생 관리에서 학생을 추가해 주세요.</div></div>';return}
  m.innerHTML='<div class="lv-wrap"><p class="lv-note">'+(mode==='cloud'?'학생 태블릿에서 일어나는 일이 여기에 바로 보여요. 여기서 누른 버튼도 학생 태블릿에 바로 적용돼요.':'인터넷 연결이 없어 이 기기의 시간표만 보여요.')+'</p><div class="lv-grid">'+students.map(liveCard).join('')+'</div></div>';
}
function tickLive(){
  if(view!=='teacher'||T.tab!=='live')return;
  var changed=false;
  students.forEach(function(st){var s=sessions[st.id]||emptySession();if(phaseOf(s)+(s.act&&s.act.ai!=null?'#'+s.act.ai:'')!==livePhases[st.id])changed=true});
  if(changed){renderLive();return}
  students.forEach(function(st){
    var s=sessions[st.id];if(!s)return;var a=s.act;
    var t=document.querySelector('.lv-time[data-sid="'+st.id+'"]'),b=document.querySelector('[data-bar="'+st.id+'"]'),g=document.querySelector('[data-ago="'+st.id+'"]');
    if(a&&a.total){var r=actRem(a);if(t)t.textContent=fmt(r);if(b)b.style.width=(100*r/a.total).toFixed(1)+'%'}
    if(g)g.textContent=ago(s.updatedAt);
  });
}
setInterval(tickLive,1000);
function teacherOp(op,sid){
  var s=clone(sessions[sid]||emptySession()),a=s.act,now=Date.now();
  if(op==='t-finalize'){if(!s.tower.length)return;finalizeSession(s)}
  else if(op==='t-clear'){s={tower:[],finalized:false,act:null}}
  else if(op==='t-start'){if(!s.tower.length)return;s.act=makeAct(s.tower[0],getBlock(s.tower[0].blockId))}
  else if(op==='t-pause'){if(!a||!a.total)return;a.pausedRem=actRem(a)}
  else if(op==='t-resume'){if(!a||a.pausedRem==null)return;a.endAt=now+a.pausedRem;a.pausedRem=null}
  else if(op==='t-plus'){if(!a||!a.total)return;if(a.pausedRem!=null)a.pausedRem+=60000;else a.endAt=Math.max(a.endAt,now)+60000;a.total=Math.max(a.total,actRem(a));}
  else if(op==='t-stop'){s.act=null}
  else if(op==='t-nextact'){if(!a||a.ai==null)return;var nb2=getBlock(a.blockId);if(a.ai>=blockActs(nb2).length-1)return;s.act=advanceAct(a)}
  else if(op==='t-done'){var f=s.tower.shift();if(f&&a&&a.uid===f.uid)s.act=null}
  else return;
  if(sid===deviceSid&&view!=='student')S=normSession(s);
  persistSession(sid,s);
}

  return '<div class="fld ac-fld"><div class="lbl"><span class="num">5</span>🧩 수업 활동 구조화 <span class="ac-count">'+(acts.length?'활동 '+acts.length+'개':'아직 없음')+'</span></div>'+
    '<div class="help" style="margin:0 0 10px">이 수업 시간에 할 활동을 순서대로 넣어요. [시작해요]를 누르면 지금 할 활동이 크게 보여요.<br>⏱ 시간 ON: 시간이 끝나면 다음 활동으로 저절로 넘어가요 (1분 전에 다음 활동 카드가 나와요). · OFF: [다음 활동을 해요] 버튼으로 넘어가요.</div>'+
    rows+
    (acts.length<10?'<button class="btn" data-act="d-actadd">＋ 활동 추가</button>':'')+(acts.length?'<span class="help" style="margin-left:10px">'+(anyTimed?'시간을 정한 활동 합계 '+actMinutesSum(d)+'분 · ':'')+'최대 10개</span>':'')+
    (acts.length?'<div class="sub"><div class="lbl2">활동 순서 표기</div><div class="seg">'+seg('d-actstyle','words',d.actStyle||'words','🔤 first-then','먼저 → 다음에 → … → 마지막')+seg('d-actstyle','number',d.actStyle||'words','🔢 1, 2, 3','숫자로 순서 표시')+'</div><div class="help">표지판 문구와 색은 학생별 🎛️ 화면 설정을 따라요.</div></div>'+
      (anyTimed?'<div class="sub"><div class="lbl2">⏱ 타이머 모양</div><div class="seg">'+seg('d-ttype','analog',tt,'🕐 아날로그 시계')+seg('d-ttype','digital',tt,'🔢 디지털 시계')+seg('d-ttype','both',tt,'🕐 + 🔢 둘 다')+'</div></div>':''):'')+
    '</div>';
}
function updatePreview(){var p=$('#t-preview');if(p&&T.draft)p.innerHTML=blockHTML(T.draft)}
function saveDraft(){
  var d=T.draft;d.name=(d.name||'').trim();
  if(!d.name){toast('블록 이름을 적어 주세요');var f=$('#f-name');if(f)f.focus();return}
  if(!d.order)d.order=Date.now();
  if(d.type==='class'&&d.acts)d.acts.forEach(function(x,i){x.name=String(x.name||'').trim()||('활동 '+(i+1))});
  saveBlock(d);T.selId=d.id;T.draft=clone(getBlock(d.id));T.draft.id=d.id;
  renderBlockList();renderEditor();
  toast(d.visible?'저장했어요 ✓':'저장했어요 · 📦 토막 창고에 있어요');
}
function readImage(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onerror=rej;fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,side=Math.min(w,h),out=Math.min(360,side),cv=document.createElement('canvas');cv.width=cv.height=out;var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,out,out);cx.drawImage(im,(w-side)/2,(h-side)/2,side,side,0,0,out,out);res(cv.toDataURL('image/jpeg',.8))};im.src=fr.result};fr.readAsDataURL(file)})}

/* ================= 이벤트 ================= */
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-act]');
  if(!t){var p=e.target.closest&&e.target.closest('.pblk');if(p&&e.detail===0)addToTower(p.dataset.id);return}
  var a=t.dataset.act,v=t.dataset.v,id=t.dataset.id,d=T.draft,vp;
  switch(a){
    case 'open-pw':openPw();break;
    case 'pw-key':pwKey(v);break;
    case 'pw-close':closeModal();break;
    case 'pick':deviceSid=id;lsSet(LS_DEVICE,id);enterStudent();break;
    case 'rm':removeFloor(+t.dataset.idx);break;
    case 'scroll-a':case 'scroll-b':vp=$('#tower-wrap');if(vp)glide(vp,clamp(vpPos(vp)+(a==='scroll-a'?-1:1)*(vp._hz?vp.clientWidth:vp.clientHeight)*.7,0,vpMax(vp)));break;
    case 'clear':S.tower=[];commitSession();renderTower();renderControls();break;
    case 'finalize':ac();finalizeSession(S);commitSession();cheerSound();applyFinUI();toast('멋진 시간표가 완성됐어요! ⭐');break;
    case 'start':ac();startHere();break;
    case 'done':ac();doDone();break;
    case 'new-day':S=emptySession();commitSession();applyFinUI();break;
    case 'act-close':case 'act-back':S.act=null;closeOverlay();commitSession();break;
    case 'act-next':(function(){if(!S.act||S.act.ai==null)return;var b0=getBlock(S.act.blockId);if(S.act.ai>=blockActs(b0).length-1)return;var o=S.act;S.act=advanceAct(o);commitSession();syncOverlay(o,S.act)})();break;
    case 'act-done':S.act=null;closeOverlay();doDone();if(!busy)commitSession();break;
    case 'exit-teacher':exitTeacher();break;
    case 'go-login':renderLogin();break;
    case 'login-back':ssDel(SS_TEACHER);if(CLS)route();else renderJoin();break;
    case 'logout':closeModal();Promise.resolve(sb&&sb.auth.signOut()).catch(function(){}).then(function(){teacherUser=null;ownsClass=null;ssDel(SS_TEACHER);toast('로그아웃했어요');if(CLS)route();else renderJoin()});break;
    case 'dm-teacher':closeModal();ssSet(SS_TEACHER,JSON.stringify({tab:T.tab||'live'}));openTeacher();break;
    case 'dm-student':closeModal();deviceSid=null;lsDel(LS_DEVICE);renderPick();break;
    case 'dm-leave':closeModal();unsubscribe();CLS=null;lsDel(LS_CODE);lsDel(LS_DEVICE);deviceSid=null;renderJoin();break;
    case 'cls-code':showModal('<h2>교실 코드 바꾸기</h2><p>바꾸면 학생 태블릿에서 새 코드를 다시 입력해야 해요.</p><form id="code-form" class="join-form col"><input class="txt code-in" id="f-newcode" maxlength="32" autocapitalize="characters" spellcheck="false" value="'+randomCode()+'"><div class="row"><button class="btn ghost-btn" type="button" data-act="del-no">취소</button><button class="btn primary" type="submit">바꾸기</button></div></form>');break;
    case 'tab':T.tab=v;T.sdraft=null;saveTeacherSS();renderTeacher();break;
    case 's-pick':T.sSel=id;T.sdraft=null;renderSettingsTab();break;
    case 's-layout':T.sdraft.layout=v;renderSettingsTab();break;
    case 's-style':T.sdraft.signStyle=v;renderSettingsTab();break;
    case 's-numf':T.sdraft.numFormat=v;renderSettingsTab();break;
    case 's-wdel':T.sdraft.words.splice(+v,1);T.sdraft.wordColors.splice(+v,1);renderSettingsTab();break;
    case 's-wadd':T.sdraft.wordColors[T.sdraft.words.length]=WORD_COLORS[T.sdraft.words.length%WORD_COLORS.length];T.sdraft.words.push('');renderSettingsTab();setTimeout(function(){var ins=document.querySelectorAll('.w-in[data-wi]');if(ins.length)ins[ins.length-1].focus()},50);break;
    case 's-lasttog':T.sdraft.lastLabel=T.sdraft.lastLabel?'':'마지막';renderSettingsTab();break;
    case 's-ncm':T.sdraft.numColorMode=v;renderSettingsTab();break;
    case 's-nsolid':T.sdraft.numSolid=v;renderSettingsTab();break;
    case 's-ncadd':(function(){var a=T.sdraft.numColors;if(a.length>=99)return;a.push(DEFAULT_NUM_COLORS[a.length%DEFAULT_NUM_COLORS.length]);renderSettingsTab()})();break;
    case 's-ncdel':if(T.sdraft.numColors.length>1){T.sdraft.numColors.pop();renderSettingsTab()}break;
    case 's-preset':(function(){var pr=WORD_PRESETS[+v];if(!pr)return;T.sdraft.words=pr.words.slice();T.sdraft.lastLabel=pr.last;renderSettingsTab()})();break;
    case 's-save':saveStudentSettings([T.sSel]);break;
    case 's-saveall':saveStudentSettings(students.map(function(x){return x.id}));break;
    case 's-reset':T.sdraft=clone(DEFAULT_SET);renderSettingsTab();toast('처음 설정으로 바꿨어요. [저장하기]를 눌러야 적용돼요');break;
    case 't-nextact':case 't-finalize':case 't-clear':case 't-start':case 't-pause':case 't-resume':case 't-plus':case 't-stop':case 't-done':teacherOp(a,id);break;
    case 'st-add':saveStudent({id:'s'+uid(),name:'학생 '+(students.length+1),emoji:KID_EMOJIS[students.length%KID_EMOJIS.length],order:Date.now()});renderStudentsTab();setTimeout(function(){var ins=document.querySelectorAll('.st-name');if(ins.length){ins[ins.length-1].focus();ins[ins.length-1].select()}},50);break;
    case 'st-emoji':(function(){var s=getStudent(id);if(!s)return;var i=KID_EMOJIS.indexOf(s.emoji);s=Object.assign({},s,{emoji:KID_EMOJIS[(i+1)%KID_EMOJIS.length]});saveStudent(s);renderStudentsTab()})();break;
    case 'st-open':deviceSid=id;lsSet(LS_DEVICE,id);toast('이 기기는 이제 '+(getStudent(id)||{}).name+'의 시간표예요');ssDel(SS_TEACHER);enterStudent();break;
    case 'st-del':(function(){var s=getStudent(id);if(!s)return;showModal('<h2>학생을 지울까요?</h2><p>\''+esc(s.name)+'\'의 시간표도 함께 지워져요.</p><div class="row"><button class="btn ghost-btn" data-act="del-no">취소</button><button class="btn danger" data-act="st-del-yes" data-id="'+esc(id)+'">지우기</button></div>')})();break;
    case 'st-del-yes':closeModal();deleteStudent(id);if(id===deviceSid){deviceSid=null;lsDel(LS_DEVICE)}renderStudentsTab();toast('학생을 지웠어요');break;
    case 'new-block':T.selId=null;T.draft=newDraft();renderBlockList();renderEditor();setTimeout(function(){var f=$('#f-name');if(f)f.focus()},50);break;
    case 'sel':T.selId=id;T.draft=clone(getBlock(id));T.draft.id=id;renderBlockList();renderEditor();break;
    case 'vis':e.stopPropagation();(function(){var b=getBlock(id);if(!b)return;b=clone(b);b.id=id;b.visible=!b.visible;saveBlock(b);if(d&&d.id===id)d.visible=b.visible;renderBlockList();renderEditor();toast(b.visible?'👀 학생 화면으로 꺼냈어요':'📦 토막 창고로 옮겼어요')})();break;
    case 'd-type':d.type=v;renderEditor();break;
    case 'd-actadd':d.acts=d.acts||[];if(d.acts.length<10){d.acts.push({name:'',timerOn:true,minutes:10});renderEditor();updatePreview();setTimeout(function(){var ins=document.querySelectorAll('.ac-in');if(ins.length)ins[ins.length-1].focus()},50)}break;
    case 'd-actdel':d.acts.splice(+v,1);renderEditor();updatePreview();break;
    case 'd-actup':(function(){var i=+v;if(i<1)return;var x=d.acts[i];d.acts[i]=d.acts[i-1];d.acts[i-1]=x;renderEditor()})();break;
    case 'd-acttimer':d.acts[+v].timerOn=!d.acts[+v].timerOn;renderEditor();updatePreview();break;
    case 'd-actmin':(function(){var pr=String(v).split(':'),x=d.acts[+pr[0]];x.minutes=clamp((+x.minutes||10)+(+pr[1]),1,60);renderEditor();updatePreview()})();break;
    case 'd-actstyle':d.actStyle=v;renderEditor();break;
    case 'd-emoji':d.img={kind:'emoji',value:v};renderEditor();break;
    case 'd-noimg':d.img={kind:'none',value:''};renderEditor();break;
    case 'd-color':d.color=v;renderEditor();break;
    case 'd-timer':d.timerOn=!d.timerOn;renderEditor();break;
    case 'd-min':d.minutes=clamp((+d.minutes||20)+(+v),1,60);renderEditor();break;
    case 'd-minset':d.minutes=+v;renderEditor();break;
    case 'd-ttype':d.timerType=v;renderEditor();break;
    case 'd-visible':d.visible=!d.visible;renderEditor();break;
    case 'd-save':saveDraft();break;
    case 'd-cancel':T.draft=T.selId&&getBlock(T.selId)?Object.assign(clone(getBlock(T.selId)),{id:T.selId}):null;renderBlockList();renderEditor();break;
    case 'd-del':showModal('<h2>블록을 지울까요?</h2><p>\''+esc(d.name)+'\' 블록이 완전히 없어져요.<br>잠깐 숨기려면 📦 토막 창고를 쓰세요.</p><div class="row"><button class="btn ghost-btn" data-act="del-no">취소</button><button class="btn danger" data-act="del-yes">지우기</button></div>');break;
    case 'del-no':closeModal();break;
    case 'del-yes':closeModal();deleteBlock(d.id);T.selId=null;T.draft=null;renderBlockList();renderEditor();toast('블록을 지웠어요');break;
  }
});
document.addEventListener('submit',function(e){
  var f=e.target;e.preventDefault();
  if(f.id==='join-form'){var c=normCode($('#f-code').value);if(c)joinWith(c)}
  else if(f.id==='login-form'){
    var em=$('#f-email').value.trim(),p=$('#f-pw').value;if(!em||!p)return;
    renderLoading('로그인하고 있어요…');
    sb.auth.signInWithPassword({email:em,password:p}).then(function(r){
      if(r.error){renderLogin('이메일 또는 비밀번호가 맞지 않아요.');return}
      teacherUser=r.data.user;ownsClass=null;afterTeacherLogin();
    }).catch(function(){renderLogin('로그인하지 못했어요. 인터넷 연결을 확인해 주세요.')});
  }
  else if(f.id==='class-form')createClass($('#f-cname').value,$('#f-ccode').value);
  else if(f.id==='code-form'){
    var nc=normCode($('#f-newcode').value);
    if(!/^[A-Z0-9]{6,32}$/.test(nc)){toast('영문 대문자와 숫자 6~32자로 정해 주세요');return}
    sb.from('classrooms').update({join_code:nc}).eq('id',CLS.id).select('id').then(function(r){
      if(r.error){toast(r.error.code==='23505'?'이미 다른 교실이 쓰는 코드예요':'바꾸지 못했어요');return}
      if(!r.data||!r.data.length){toast('선생님 로그인이 필요해요');return}
      closeModal();CLS.code=nc;lsSet(LS_CODE,nc);subscribe();renderStudentsTab();toast('교실 코드를 '+nc+'(으)로 바꿨어요');
    });
  }
});
document.addEventListener('input',function(e){
  var t=e.target,d=T.draft;if(!d&&!T.sdraft)return;
  if(T.sdraft&&t.type==='color'&&(t.dataset.wc!=null||t.dataset.nc!=null||t.id==='s-lastc'||t.id==='s-nsolid')){
    var cv=t.value;
    if(t.dataset.wc!=null)T.sdraft.wordColors[+t.dataset.wc]=cv;
    else if(t.dataset.nc!=null)T.sdraft.numColors[+t.dataset.nc]=cv;
    else if(t.id==='s-lastc')T.sdraft.lastColor=cv;
    else T.sdraft.numSolid=cv;
    var bx=t.parentNode;if(bx){bx.style.background=cv;bx.style.color=fgFor(cv)}
    updateSettingsPreview();return;
  }
  if(t.dataset&&t.dataset.wi!=null&&T.sdraft){T.sdraft.words[+t.dataset.wi]=t.value;updateSettingsPreview();return}
  if(t.id==='s-last'&&T.sdraft){T.sdraft.lastLabel=t.value;updateSettingsPreview();return}
  if(d&&t.classList&&t.classList.contains('ac-in')){d.acts[+t.dataset.ai].name=t.value;return}
  if(d&&t.classList&&t.classList.contains('ac-mins')){var mv2=Math.round(+t.value);if(mv2>=1&&mv2<=60){d.acts[+t.dataset.am].minutes=mv2;updatePreview()}return}
  if(t.id==='f-name'){d.name=t.value;updatePreview()}
  else if(t.id==='f-min'){d.minutes=+t.value;var mv=$('#min-val');if(mv)mv.textContent=t.value+'분';[].forEach.call(document.querySelectorAll('.chips button'),function(b){b.classList.toggle('on',+b.dataset.v===d.minutes)});updatePreview()}
  else if(t.id==='f-color'){d.color=t.value;updatePreview()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-photo'){var f=t.files&&t.files[0];if(!f||!T.draft)return;readImage(f).then(function(url){T.draft.img={kind:'photo',value:url};renderEditor()}).catch(function(){toast('사진을 불러오지 못했어요')})}
  else if(t.id==='f-color'&&T.draft){renderEditor()}
  else if(t.classList&&t.classList.contains('ac-mins')&&T.draft){var x=T.draft.acts[+t.dataset.am];x.minutes=clamp(Math.round(+t.value)||x.minutes||10,1,60);renderEditor();updatePreview()}
  else if(t.id==='f-clsname'&&CLS){var nm=t.value.trim();if(!nm){t.value=CLS.name;return}CLS.name=nm;var cid=CLS.id;enqueue('classroom',function(){return sb.from('classrooms').update({name:nm}).eq('id',cid)});toast('교실 이름을 바꿨어요');updateConn()}
  else if(t.classList&&t.classList.contains('st-name')){var s=getStudent(t.dataset.sid);var nm=t.value.trim();if(s&&nm&&nm!==s.name){saveStudent(Object.assign({},s,{name:nm}));toast('이름을 바꿨어요')}else if(s&&!nm)t.value=s.name}
});
