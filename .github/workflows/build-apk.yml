# 오늘의 시간표 탑 · 안드로이드 앱(APK) 자동 만들기
# index.html이나 app 폴더가 바뀌어 main에 올라가면 GitHub가 APK를 새로 만들어
# Releases에 올려요. 태블릿 다운로드 주소는 항상 같아요:
#   https://github.com/<아이디>/<저장소>/releases/latest/download/timetable-tower.apk
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 도구 설치
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: 앱 화면 파일 준비 (index.html 복사, Supabase 도구를 앱 안에 포함)
        working-directory: app
        run: |
          rm -rf www && mkdir -p www/icons
          cp ../index.html www/index.html
          cp ../icons/*.png www/icons/ 2>/dev/null || true
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2#supabase.js#' www/index.html
          grep -q 'src="supabase.js"' www/index.html

      - name: 안드로이드 프로젝트 만들기, 아이콘 넣기
        working-directory: app
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: 서명 키 준비 (업데이트할 때 앱을 지우지 않아도 되도록 항상 같은 키 사용)
        run: |
          mkdir -p ~/.android
          cp app/debug.keystore ~/.android/debug.keystore

      - name: APK 만들기
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk timetable-tower.apk

      - uses: actions/upload-artifact@v4
        with:
          name: timetable-tower-apk
          path: timetable-tower.apk

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 시간표 탑 앱 (빌드 ${{ github.run_number }})
          body: 태블릿에서 timetable-tower.apk를 눌러 내려받아 설치하세요.
          files: timetable-tower.apk
          make_latest: true
